### Model
# Replace this value with the merged CPT checkpoint for the sequential CPT-to-SFT workflow.
model_name_or_path: saves/llama3.1-8b/gensyntax-cpt-merged

### Training method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
deepspeed: training/configs/ds_z3_offload.json

### Dataset
dataset: gensyntax_sft
dataset_dir: training/data
template: default
cutoff_len: 128000
overwrite_cache: true
preprocessing_num_workers: 32

### Output
output_dir: saves/llama3.1-8b/lora/gensyntax-sft
logging_steps: 1
save_strategy: epoch
plot_loss: true
save_only_model: false
overwrite_output_dir: true
report_to: none

### Optimization
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 1.0e-4
num_train_epochs: 5.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
flash_attn: fa2
enable_liger_kernel: true
use_adam_mini: true
